<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图寻 · TU XUN — 实时定位系统</title>
<script src="https://cdn.jsdelivr.net/npm/roslib@1/build/roslib.min.js"></script>
<style>
:root {
  --cyan: #00e8d0; --cyan2: #00b8a8; --cyan3: rgba(0,232,208,0.12);
  --red: #ff3050; --orange: #ff8c00; --green: #00e85c;
  --bg: #060612; --surface: rgba(10,10,28,0.9); --surface2: rgba(14,14,36,0.8);
  --text: rgba(255,255,255,0.9); --text2: rgba(255,255,255,0.5); --text3: rgba(255,255,255,0.25);
  --border: rgba(0,232,208,0.1); --border2: rgba(0,232,208,0.05);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', monospace;
  background: var(--bg); color: var(--text);
  display: flex; flex-direction: column;
}

/* ===== Top Bar ===== */
.topbar {
  height: 46px; display: flex; align-items: center; justify-content: space-between;
  padding: 0 1.2rem; background: var(--surface); border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.topbar .logo { font-size: 1.1rem; font-weight: 800; color: var(--cyan); letter-spacing: 0.04em; }
.topbar .logo sub { font-size: 0.6rem; color: var(--text3); margin-left: 0.4rem; }
.topbar .mid { display: flex; align-items: center; gap: 1rem; }
.topbar .mid .pbar-wrap { width: 160px; height: 4px; background: rgba(255,255,255,0.08); border-radius: 2px; overflow: hidden; }
.topbar .mid .pbar-inner { height: 100%; background: var(--cyan); border-radius: 2px; transition: width 0.3s; }
.topbar .mid .pct { font-size: 0.75rem; font-weight: 700; color: var(--cyan); min-width: 3rem; }
.topbar .status { font-size: 0.65rem; display: flex; align-items: center; gap: 0.4rem; }
.topbar .status .dot { width: 7px; height: 7px; border-radius: 50%; }

/* ===== Main Area ===== */
.main {
  flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 0;
  min-height: 0; overflow: hidden;
}
.panel {
  display: flex; flex-direction: column;
  border-right: 1px solid var(--border2);
  overflow: hidden;
}
.panel:last-child { border-right: none; }

.panel-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0.35rem 0.8rem; font-size: 0.65rem; letter-spacing: 0.05em;
  color: var(--text3); border-bottom: 1px solid var(--border2); flex-shrink: 0;
}
.panel-header .title { color: var(--cyan); }
.panel-body { flex: 1; overflow: hidden; position: relative; min-height: 0; }
.panel-body canvas { display: block; }
.panel-body img { width: 100%; height: 100%; object-fit: contain; background: #000; }

/* ===== Bottom Bar ===== */
.bottombar {
  height: 38px; display: flex; align-items: center; justify-content: center;
  gap: 2rem; padding: 0 1rem; background: var(--surface); border-top: 1px solid var(--border);
  font-size: 0.7rem; flex-shrink: 0;
}
.bottombar .metric { display: flex; align-items: baseline; gap: 0.4rem; }
.bottombar .metric .label { color: var(--text3); }
.bottombar .metric .value { color: var(--text); font-weight: 600; }
.bottombar .metric .value.ok { color: var(--green); }
.bottombar .metric .value.warn { color: var(--orange); }
.bottombar .sep { width: 1px; height: 14px; background: var(--border); }

/* Map legend */
.map-legend {
  position: absolute; bottom: 6px; left: 8px; display: flex; gap: 0.6rem;
  font-size: 0.58rem; color: var(--text3); z-index: 5;
}
.leg-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 2px; vertical-align: middle; }
</style>
</head>
<body>

<!-- Top Bar -->
<div class="topbar">
  <div class="logo">图寻<sub>TU XUN</sub></div>
  <div class="mid">
    <span style="font-size:0.65rem;color:var(--text3);">路线进度</span>
    <div class="pbar-wrap"><div class="pbar-inner" id="pbar" style="width:0%"></div></div>
    <span class="pct" id="pct">0%</span>
  </div>
  <div class="status" id="rosStatus">
    <span class="dot" style="background:var(--text3);"></span> ROS · 等待连接
  </div>
</div>

<!-- Main Grid: Video Left | Map + Altitude Right -->
<div class="main">
  <!-- Left: Video -->
  <div class="panel">
    <div class="panel-header">
      <span class="title">▶ LIVE · 特征追踪</span>
      <span id="videoLabel">等待数据...</span>
    </div>
    <div class="panel-body" style="display:flex;align-items:center;justify-content:center;">
      <img id="videoStream" src="" style="width:100%;height:100%;object-fit:contain;background:#000;" alt="视频加载中" />
    </div>
  </div>

  <!-- Right: Trajectory Map (top) + Altitude Profile (bottom) -->
  <div class="panel">
    <div class="panel-header">
      <span class="title">▼ 路线匹配轨迹</span>
      <span id="mapLabel">ENU 坐标系</span>
    </div>
    <div class="panel-body" style="position:relative;">
      <canvas id="trajCanvas"></canvas>
      <div class="map-legend">
        <span><span class="leg-dot" style="background:rgba(160,160,160,0.5);"></span> 路线</span>
        <span><span class="leg-dot" style="background:#5b8def;"></span> VIO</span>
        <span><span class="leg-dot" style="background:var(--cyan);box-shadow:0 0 4px var(--cyan);"></span> 匹配</span>
        <span><span class="leg-dot" style="background:var(--orange);"></span> GPS</span>
      </div>
    </div>
    <div class="panel-header" style="border-top:1px solid var(--border2);">
      <span class="title">▲ 海拔剖面</span>
      <span id="altLabel">m vs s</span>
    </div>
    <div class="panel-body" style="flex:0.6;">
      <canvas id="altCanvas"></canvas>
    </div>
  </div>
</div>

<!-- Bottom Bar: Metrics -->
<div class="bottombar" id="bottombar">
  <div class="metric"><span class="label">精度</span><span class="value ok" id="bmAcc">--m</span></div>
  <div class="sep"></div>
  <div class="metric"><span class="label">置信度</span><span class="value ok" id="bmConf">--</span></div>
  <div class="sep"></div>
  <div class="metric"><span class="label">位置</span><span class="value" id="bmPos">-- / --m</span></div>
  <div class="sep"></div>
  <div class="metric"><span class="label">距终点</span><span class="value" id="bmRemain">--m</span></div>
  <div class="sep"></div>
  <div class="metric"><span class="label">坐标</span><span class="value" id="bmCoord">--</span></div>
  <div class="sep"></div>
  <div class="metric"><span class="label">海拔</span><span class="value" id="bmAlt">--m</span></div>
  <div class="sep"></div>
  <div class="metric"><span class="label">VIO步长</span><span class="value" id="bmVio">--m</span></div>
</div>

<script>
// ===== ROS Connection =====
const ros = new ROSLIB.Ros({ url: 'ws://localhost:9090' });
let rosConnected = false, latestState = null;
let pathHistory = [], gpsFixes = [], routePoints = [];

// Load route CSV
fetch('route_table.csv')
  .then(r => r.text())
  .then(csv => {
    const lines = csv.split('\n');
    for (let i=1; i<lines.length; i++) {
      const cols = lines[i].split(',');
      if (cols.length >= 5 && cols[0] === 'point') {
        routePoints.push({ x: parseFloat(cols[2]), y: parseFloat(cols[3]), z: parseFloat(cols[4]), s: parseFloat(cols[1]), lon: parseFloat(cols[9]||0), lat: parseFloat(cols[10]||0) });
      }
    }
    if (routePoints.length > 0) {
      document.getElementById('mapLabel').textContent = routePoints[0].lon.toFixed(4)+'°E '+routePoints[0].lat.toFixed(4)+'°N';
    }
  })
  .catch(() => console.log('Route CSV not loaded'));

ros.on('connection', () => {
  rosConnected = true;
  document.getElementById('rosStatus').innerHTML = '<span class="dot" style="background:var(--green);box-shadow:0 0 8px var(--green);"></span> ROS · ONLINE';
  document.getElementById('videoStream').src = 'http://localhost:8080/stream?topic=/cam0/image_raw&type=mjpeg&quality=60';
  document.getElementById('videoLabel').textContent = '/cam0/image_raw';
});

ros.on('close', () => {
  rosConnected = false;
  document.getElementById('rosStatus').innerHTML = '<span class="dot" style="background:var(--red);"></span> ROS · 断开';
});

ros.on('error', () => {
  document.getElementById('rosStatus').innerHTML = '<span class="dot" style="background:var(--orange);"></span> ROS · 错误';
});

// GPS subscription
new ROSLIB.Topic({ ros, name: '/gps', messageType: 'sensor_msgs/NavSatFix' })
  .subscribe(msg => {
    if (msg.status && msg.status.status >= 0) {
      gpsFixes.push({ lat: msg.latitude, lon: msg.longitude, alt: msg.altitude, time: Date.now() });
      if (gpsFixes.length > 120) gpsFixes.shift();
    }
  });

// Route matcher state subscription
new ROSLIB.Topic({ ros, name: '/route_matcher/state', messageType: 'std_msgs/String' })
  .subscribe(msg => {
    try {
      const d = JSON.parse(msg.data);
      latestState = d;
      if (d.matched_x !== undefined) {
        pathHistory.push({ x: d.matched_x, y: d.matched_y, z: d.matched_z, s: d.s_m, progress: d.progress, confidence: d.confidence });
        if (pathHistory.length > 500) pathHistory.shift();
      }
      // Update all UI elements
      const p = (d.progress||0)*100;
      document.getElementById('pbar').style.width = p.toFixed(1)+'%';
      document.getElementById('pct').textContent = p.toFixed(1)+'%';
      document.getElementById('bmAcc').textContent = '±'+(d.s_std_m||0).toFixed(1)+'m';
      document.getElementById('bmConf').textContent = ((d.confidence||0)*100).toFixed(0)+'%';
      document.getElementById('bmPos').textContent = (d.s_m||0).toFixed(0)+' / '+(d.route_length_m||0).toFixed(0)+'m';
      document.getElementById('bmRemain').textContent = (d.distance_to_end_m||0).toFixed(0)+'m';
      document.getElementById('bmCoord').textContent = (d.matched_lon||0).toFixed(5)+'°E '+(d.matched_lat||0).toFixed(5)+'°N';
      document.getElementById('bmAlt').textContent = (d.matched_z||0).toFixed(1)+'m';
      document.getElementById('bmVio').textContent = (d.last_vio_delta_m||0).toFixed(2)+'m';
      // Color coding
      const accEl = document.getElementById('bmAcc');
      accEl.className = 'value ' + ((d.s_std_m||99)<3 ? 'ok' : (d.s_std_m||99)<8 ? 'warn' : '');
      const confEl = document.getElementById('bmConf');
      confEl.className = 'value ' + ((d.confidence||0)>0.7 ? 'ok' : (d.confidence||0)>0.4 ? 'warn' : '');
    } catch(e) {}
  });

// ===== Trajectory Canvas =====
(function(){
  const cv=document.getElementById('trajCanvas'); if(!cv)return;
  const ctx=cv.getContext('2d'), dpr=devicePixelRatio||1;
  let W,H;
  function resize(){
    const r=cv.parentElement.getBoundingClientRect();
    W=r.width; H=r.height;
    cv.width=W*dpr; cv.height=H*dpr; cv.style.width=W+'px'; cv.style.height=H+'px';
    ctx.setTransform(1,0,0,1,0,0); ctx.scale(dpr,dpr);
  }
  resize(); addEventListener('resize',resize);

  function w2c(px,py,allPts){
    if(allPts.length<2) return {cx:W/2,cy:H/2};
    let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
    allPts.forEach(p=>{if(p.x<minX)minX=p.x;if(p.x>maxX)maxX=p.x;if(p.y<minY)minY=p.y;if(p.y>maxY)maxY=p.y;});
    const rX=(maxX-minX)||1, rY=(maxY-minY)||1, s=Math.min((W-60)/rX,(H-50)/rY);
    return {cx:30+(px-minX)*s, cy:H-25-(py-minY)*s};
  }

  function draw(){
    ctx.clearRect(0,0,W,H);
    ctx.strokeStyle='rgba(0,232,208,0.03)'; ctx.lineWidth=0.5;
    for(let x=0;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
    for(let y=0;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}

    const allPts=[];
    routePoints.forEach(p=>allPts.push({x:p.x,y:p.y}));
    pathHistory.forEach(p=>allPts.push({x:p.x,y:p.y}));

    // Known route (grey dashed)
    if(routePoints.length>1){
      ctx.beginPath();
      const r0=w2c(routePoints[0].x,routePoints[0].y,allPts);
      ctx.moveTo(r0.cx,r0.cy);
      for(let i=1;i<routePoints.length;i++){
        const ri=w2c(routePoints[i].x,routePoints[i].y,allPts);
        ctx.lineTo(ri.cx,ri.cy);
      }
      ctx.strokeStyle='rgba(160,160,160,0.3)'; ctx.lineWidth=1.3;
      ctx.setLineDash([4,8]); ctx.stroke(); ctx.setLineDash([]);
    }

    // GPS dots (orange)
    const origin=routePoints.length>0?{lon:routePoints[0].lon,lat:routePoints[0].lat}:null;
    if(origin&&gpsFixes.length>0){
      const ER=6378137,lat0r=origin.lat*Math.PI/180;
      gpsFixes.forEach(gf=>{
        const gx=ER*(gf.lon-origin.lon)*Math.PI/180*Math.cos(lat0r);
        const gy=ER*(gf.lat-origin.lat)*Math.PI/180;
        const gc=w2c(gx,gy,allPts);
        if(Math.abs(gx)<5000){
          ctx.beginPath();ctx.arc(gc.cx,gc.cy,2.2,0,Math.PI*2);
          ctx.fillStyle='rgba(255,140,0,0.5)';ctx.fill();
        }
      });
    }

    // VIO path history (blue dashed)
    if(pathHistory.length>1){
      ctx.beginPath();
      const p0=w2c(pathHistory[0].x,pathHistory[0].y,allPts);
      ctx.moveTo(p0.cx,p0.cy);
      for(let i=1;i<pathHistory.length;i++){
        const pi=w2c(pathHistory[i].x,pathHistory[i].y,allPts);
        ctx.lineTo(pi.cx,pi.cy);
      }
      ctx.strokeStyle='rgba(91,141,239,0.3)'; ctx.lineWidth=2;
      ctx.setLineDash([6,4]); ctx.stroke(); ctx.setLineDash([]);
    }

    // Recent matched path (cyan, last 60 pts)
    const start=Math.max(0,pathHistory.length-60);
    if(start<pathHistory.length-1){
      ctx.beginPath();
      const rp0=w2c(pathHistory[start].x,pathHistory[start].y,allPts);
      ctx.moveTo(rp0.cx,rp0.cy);
      for(let i=start+1;i<pathHistory.length;i++){
        const rpi=w2c(pathHistory[i].x,pathHistory[i].y,allPts);
        ctx.lineTo(rpi.cx,rpi.cy);
      }
      ctx.strokeStyle='rgba(0,232,208,0.8)'; ctx.lineWidth=3; ctx.stroke();
      ctx.strokeStyle='rgba(0,232,208,0.15)'; ctx.lineWidth=10; ctx.stroke();
    }

    // Current position
    if(pathHistory.length>0){
      const last=pathHistory[pathHistory.length-1];
      const lp=w2c(last.x,last.y,allPts);
      const pulse=1+0.3*Math.sin(Date.now()/400);
      ctx.beginPath();ctx.arc(lp.cx,lp.cy,6,0,Math.PI*2);
      ctx.fillStyle='rgba(0,255,240,0.8)';ctx.fill();
      ctx.beginPath();ctx.arc(lp.cx,lp.cy,14*pulse,0,Math.PI*2);
      ctx.fillStyle='rgba(0,232,208,'+(0.12*pulse)+')';ctx.fill();
    }

    if(pathHistory.length<2){
      ctx.fillStyle='rgba(255,255,255,0.3)';ctx.font='14px monospace';
      ctx.textAlign='center';ctx.fillText('等待位置数据...',W/2,H/2);
    }
    requestAnimationFrame(draw);
  }
  draw();
})();

// ===== Altitude Canvas =====
(function(){
  const cv=document.getElementById('altCanvas'); if(!cv)return;
  const ctx=cv.getContext('2d'), dpr=devicePixelRatio||1;
  let W,H;
  function resize(){
    const r=cv.parentElement.getBoundingClientRect();
    W=r.width; H=r.height;
    cv.width=W*dpr; cv.height=H*dpr; cv.style.width=W+'px'; cv.style.height=H+'px';
    ctx.setTransform(1,0,0,1,0,0); ctx.scale(dpr,dpr);
  }
  resize(); addEventListener('resize',resize);

  function drawAlt(){
    ctx.clearRect(0,0,W,H);
    ctx.strokeStyle='rgba(0,232,208,0.03)'; ctx.lineWidth=0.5;
    for(let x=0;x<W;x+=50){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
    for(let y=0;y<H;y+=50){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}

    if(routePoints.length>1){
      const alts=routePoints.map(p=>p.z||0);
      const minZ=Math.min(...alts),maxZ=Math.max(...alts),zR=(maxZ-minZ)||1;
      const maxS=routePoints[routePoints.length-1].s||1;
      const padL=45,padR=15,padT=15,padB=25;

      // Route altitude (grey dashed)
      ctx.beginPath();
      const r0x=padL,r0y=H-padB-((routePoints[0].z-minZ)/zR)*(H-padT-padB);
      ctx.moveTo(r0x,r0y);
      for(let i=1;i<routePoints.length;i++){
        ctx.lineTo(padL+(routePoints[i].s/maxS)*(W-padL-padR),
                   H-padB-((routePoints[i].z-minZ)/zR)*(H-padT-padB));
      }
      ctx.strokeStyle='rgba(160,160,160,0.3)';ctx.lineWidth=1.2;
      ctx.setLineDash([4,6]);ctx.stroke();ctx.setLineDash([]);

      // Matched altitude (cyan)
      if(pathHistory.length>1){
        ctx.beginPath();
        const ph0=pathHistory[0];
        ctx.moveTo(padL+((ph0.s||0)/maxS)*(W-padL-padR),
                   H-padB-((ph0.z-minZ)/zR)*(H-padT-padB));
        for(let i=1;i<pathHistory.length;i++){
          ctx.lineTo(padL+((pathHistory[i].s||0)/maxS)*(W-padL-padR),
                     H-padB-((pathHistory[i].z-minZ)/zR)*(H-padT-padB));
        }
        ctx.strokeStyle='rgba(0,232,208,0.7)';ctx.lineWidth=2.2;ctx.stroke();

        // Current position dot
        const last=pathHistory[pathHistory.length-1];
        const lx=padL+((last.s||0)/maxS)*(W-padL-padR);
        const ly=H-padB-((last.z-minZ)/zR)*(H-padT-padB);
        ctx.beginPath();ctx.arc(lx,ly,4.5,0,Math.PI*2);
        ctx.fillStyle='rgba(0,255,240,0.8)';ctx.fill();
        ctx.beginPath();ctx.arc(lx,ly,10,0,Math.PI*2);
        ctx.fillStyle='rgba(0,232,208,0.15)';ctx.fill();
      }

      // Axis labels
      ctx.fillStyle='rgba(255,255,255,0.35)';ctx.font='10px monospace';
      ctx.textAlign='right';
      ctx.fillText(maxZ.toFixed(0),padL-4,padT+10);
      ctx.fillText(minZ.toFixed(0),padL-4,H-padB);
      ctx.textAlign='left';
      ctx.fillText('0m',padL,H-padB+14);
      ctx.fillText(maxS.toFixed(0)+'m',W-padR,H-padB+14);
    } else {
      ctx.fillStyle='rgba(255,255,255,0.3)';ctx.font='13px monospace';
      ctx.textAlign='center';ctx.fillText('加载路线数据...',W/2,H/2);
    }
    requestAnimationFrame(drawAlt);
  }
  drawAlt();
})();
</script>
</body>
</html>
